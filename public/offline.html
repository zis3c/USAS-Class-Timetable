<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | USAS Class Timetable</title>
    <link rel="stylesheet" href="/error.css">
    <script type="module" src="/error-page.js"></script>
  </head>
  <body
    data-page-title="Offline | USAS Class Timetable"
    data-brand="USAS Class Timetable"
    data-icon="OFF"
    data-eyebrow="No internet"
    data-title="You are offline right now."
    data-lead="The browser could not reach the network. Use the app again once the connection is back."
    data-callout-title="What to do"
    data-items="Reconnect to the internet|Reload this page|Return to the landing page"
    data-primary-label="Try again"
    data-primary-href="/"
    data-secondary-label="Login"
    data-secondary-href="/login"
    data-footer="Offline fallback page for USAS Class Timetable."
  >
    <div class="wrap">
      <div class="bg-blur">
        <div class="blob one"></div>
        <div class="blob two"></div>
      </div>
      <main class="panel">
        <div class="brand" data-role="brand"></div>
        <div class="title-row">
          <div class="icon" data-role="icon"></div>
          <div>
            <div class="eyebrow" data-role="eyebrow"></div>
            <h1 data-role="title"></h1>
          </div>
        </div>
        <p class="lead" data-role="lead"></p>
        <div class="callout">
          <h2 data-role="callout-title"></h2>
          <ul data-role="items">
          </ul>
        </div>
        <div class="actions">
          <a class="btn primary" data-role="primary" href="/"></a>
          <a class="btn secondary" data-role="secondary" href="/login"></a>
        </div>
        <div class="footer" data-role="footer"></div>
      </main>
    </div>
  </body>
</html>
